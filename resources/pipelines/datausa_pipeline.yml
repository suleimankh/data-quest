resources:
  pipelines:
    datausa_pipeline:
      name: datausa_pipeline_${bundle.target}
      target: datausa
      catalog: ${var.catalog_prefix}rearc
      
      photon: true
      serverless: true
      channel: CURRENT
      
      libraries:
        - notebook:
            path: ${var.git_source_path}/datausa_pipeline/transformations/bronze.py
        - notebook:
            path: ${var.git_source_path}/datausa_pipeline/transformations/silver_population.py
      
      configuration:
        pipeline.runAsUser: ${workspace.current_user.userName}
      
      permissions:
        - level: CAN_VIEW
          group_name: users
